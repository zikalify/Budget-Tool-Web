<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="Budget Coin Icon">
  <defs>
    <!-- Smooth drop shadows -->
    <filter id="m3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#153625" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#153625" flood-opacity="0.14" />
    </filter>
    <filter id="inner-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#ffffff" flood-opacity="0.45" />
    </filter>

    <!-- Material You Gold & Sage Gradients -->
    <linearGradient id="bg-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e5" />
      <stop offset="100%" stop-color="#cde8ca" />
    </linearGradient>

    <!-- Coin Outer Rim & Bevel -->
    <linearGradient id="coin-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd868" />
      <stop offset="50%" stop-color="#f5a623" />
      <stop offset="100%" stop-color="#cf7a0c" />
    </linearGradient>

    <!-- Coin Face Gradient -->
    <linearGradient id="coin-face" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#fff2a1" />
      <stop offset="35%" stop-color="#ffdc5e" />
      <stop offset="100%" stop-color="#f7b731" />
    </linearGradient>

    <!-- Subtle Inner Dish -->
    <linearGradient id="coin-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5aa20" />
      <stop offset="100%" stop-color="#ffea8a" />
    </linearGradient>

    <!-- Emblem Gradient -->
    <linearGradient id="emblem-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8f4a04" />
      <stop offset="100%" stop-color="#5a2e00" />
    </linearGradient>
  </defs>

  <!-- Background Material Squircle Container -->
  <rect x="12" y="12" width="168" height="168" rx="52" fill="url(#bg-badge)" />
  
  <!-- Subtle decorative ring on container -->
  <rect x="12" y="12" width="168" height="168" rx="52" fill="none" stroke="#2d6a4f" stroke-opacity="0.12" stroke-width="3" />

  <!-- Coin Group with M3 Elevation -->
  <g filter="url(#m3-shadow)">
    <!-- 3D Coin Edge / Thickness Layer -->
    <ellipse cx="96" cy="103" rx="56" ry="56" fill="#ba6804" />
    
    <!-- Outer Golden Bevel -->
    <circle cx="96" cy="94" r="56" fill="url(#coin-rim)" />
    
    <!-- Main Coin Face -->
    <circle cx="96" cy="94" r="50" fill="url(#coin-face)" />

    <!-- Inner Engraved Ridge Ring -->
    <circle cx="96" cy="94" r="41" fill="none" stroke="#e89816" stroke-width="2.5" stroke-dasharray="7 3.5" opacity="0.8" />
    <circle cx="96" cy="94" r="37" fill="url(#coin-inner)" opacity="0.32" />

    <!-- Organic Currency Symbol ($ and Plant Sprout Motif) -->
    <!-- Central Dollar Emblem with Soft Bevel -->
    <g filter="url(#inner-glow)">
      <!-- Vertical bar -->
      <line x1="96" y1="71" x2="96" y2="117" stroke="url(#emblem-grad)" stroke-width="6.5" stroke-linecap="round" />
      <!-- S-curve -->
      <path d="M109 82.5 c-3-6-10-8.5-16-7.5 -6 1-10.5 4.5-10.5 9.5 0 8 10 10.5 17 12 7.5 1.8 14 5 14 12 0 7-6 11.5-14.5 11.5 -8.5 0-14.5-4-17-9"
            fill="none"
            stroke="url(#emblem-grad)"
            stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round" />
    </g>

    <!-- Material Light Gleam Accent -->
    <ellipse cx="78" cy="74" rx="14" ry="7" transform="rotate(-35 78 74)" fill="#ffffff" opacity="0.65" />
    <circle cx="120" cy="112" r="3.5" fill="#ffffff" opacity="0.45" />

    <!-- Mini Sparkle / Star in top-right of coin -->
    <path d="M132 58 Q132 66 140 66 Q132 66 132 74 Q132 66 124 66 Q132 66 132 58 Z" fill="#fff9d6" opacity="0.95" />
    <circle cx="132" cy="66" r="2" fill="#ffffff" />
  </g>
</svg>
